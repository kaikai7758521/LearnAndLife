name: Build manifest

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/build-manifest.ps1'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-manifest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate manifest.json
        shell: pwsh
        run: ./scripts/build-manifest.ps1

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain manifest.json)" ]; then
            echo "manifest.json 已是最新，无需提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest.json"
          git push
