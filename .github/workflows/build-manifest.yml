name: Build manifest, translations and README outlines

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/update-readme.py'
      - 'scripts/translate-notes.py'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-manifest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Translate notes to English
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_URL: ${{ vars.TRANSLATE_API_URL }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: python3 scripts/translate-notes.py

      - name: Update manifest and README outlines
        run: python3 scripts/update-readme.py

      - name: Commit and push changes
        run: |
          for file in manifest.json manifest.en.json README.md README.en.md; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git add -- '*.en.md' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "索引、译文与 README 目录均是最新，无需提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update manifest, English notes and README outlines"
          git push
