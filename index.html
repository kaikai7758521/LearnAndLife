<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的学习笔记</title>
<meta name="description" content="按「学习方向 / 内容 / 细节」组织的个人学习笔记，持续更新。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">

<!-- 代码高亮主题：通过 disabled 属性切换 -->
<link rel="stylesheet" id="hljs-light" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<link rel="stylesheet" id="hljs-dark" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" disabled>
<!-- 数学公式 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<!-- 站点样式 -->
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<div id="progress" class="progress" aria-hidden="true"></div>

<header class="topbar">
  <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
  </button>

  <a class="brand" href="#/" title="返回首页">
    <span class="brand-logo" aria-hidden="true">📚</span>
    <span class="brand-text">
      <strong id="site-title">学习笔记</strong>
      <small id="site-subtitle">知识沉淀 · 持续更新</small>
    </span>
  </a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 1 1-4.9 14.3l-3.4 3.4-1.4-1.4 3.4-3.4A8 8 0 0 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input id="search" type="search" placeholder="搜索笔记标题 / 全文（按 / 聚焦）" autocomplete="off" spellcheck="false" aria-label="搜索笔记">
    <div id="search-results" class="search-results" role="listbox" hidden></div>
  </div>

  <div class="topbar-actions">
    <button id="theme-btn" class="icon-btn" type="button" title="切换深色 / 浅色" aria-label="切换主题">🌙</button>
    <a id="repo-link" class="icon-btn repo-link" href="#" target="_blank" rel="noopener" title="GitHub 仓库" hidden>
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar" aria-label="笔记目录">
    <div class="sidebar-head">
      <span class="sidebar-title">目录</span>
      <button id="expand-btn" class="link-btn" type="button">展开全部</button>
    </div>
    <nav id="nav" class="nav"><div class="nav-loading">正在加载目录…</div></nav>
    <div class="sidebar-foot">
      <span id="nav-count"></span>
      <a id="repo-link-2" href="#" target="_blank" rel="noopener" hidden>GitHub ↗</a>
    </div>
  </aside>
  <div id="overlay" class="overlay" hidden></div>

  <main id="main" class="main" tabindex="-1">
    <nav id="breadcrumb" class="breadcrumb" aria-label="当前位置"></nav>
    <article id="article" class="article markdown-body">
      <div class="skeleton"><span></span><span></span><span></span><span></span></div>
    </article>
    <nav id="pager" class="pager" aria-label="上一篇 / 下一篇"></nav>
    <footer class="page-foot">
      <span id="foot-text"></span>
      <a id="edit-link" href="#" target="_blank" rel="noopener" hidden>在 GitHub 编辑此页 ↗</a>
    </footer>
  </main>

  <aside class="toc-wrap" aria-label="本页目录">
    <div class="toc-head">本页目录</div>
    <nav id="toc" class="toc"></nav>
  </aside>

  <button id="top-btn" class="top-btn" type="button" title="回到顶部" aria-label="回到顶部" hidden>↑</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="./assets/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
