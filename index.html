<script>
  // 在样式加载前恢复主题，避免深色模式刷新时闪白。
  (function () {
    try {
      var theme = localStorage.getItem('ln-theme');
      if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* ignore */ }
  })();
</script>

<!-- ===================== 桌面窗口 ===================== -->
<div class="window" id="window">
  <div class="titlebar" id="titlebar">
    <div class="traffic" role="group" aria-label="窗口控制">
      <button class="tl tl-close" id="win-close" type="button" title="关闭窗口（回到桌面）" aria-label="关闭窗口"></button>
      <button class="tl tl-min" id="win-min" type="button" title="最小化到程序坞" aria-label="最小化窗口"></button>
      <button class="tl tl-zoom" id="win-zoom" type="button" title="缩放窗口" aria-label="缩放窗口"></button>
    </div>

    <button id="menu-btn" class="tb-btn tb-sidebar" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <button id="sidebar-btn" class="tb-btn tb-sidebar" type="button" aria-label="隐藏目录" title="隐藏 / 显示目录" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 4h18v16H3V4zm2 2v12h5V6H5zm7 0v12h7V6h-7z"/></svg>
    </button>

    <div class="window-title">
      <span id="win-icon" class="win-icon page-badge" data-icon="📚" aria-hidden="true"></span>
      <span class="win-title-text">
        <span id="win-title">学习笔记</span>
        <small id="win-path">首页</small>
      </span>
    </div>

    <div class="titlebar-tools">
      <div class="search-wrap" id="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 1 1-4.9 14.3l-3.4 3.4-1.4-1.4 3.4-3.4A8 8 0 0 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
        <input id="search" type="search" placeholder="搜索笔记（按 / 聚焦）" autocomplete="off" spellcheck="false" aria-label="搜索笔记">
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </div>
      <button id="search-toggle" class="tb-btn" type="button" title="搜索（按 /）" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 1 1-4.9 14.3l-3.4 3.4-1.4-1.4 3.4-3.4A8 8 0 0 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
      </button>
    </div>
  </div>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="笔记目录">
      <div class="sidebar-head">
        <span class="sidebar-title"><span class="sidebar-dot" aria-hidden="true"></span>笔记</span>
        <button id="expand-btn" class="link-btn" type="button">展开全部</button>
      </div>
      <nav id="nav" class="nav"><div class="nav-loading">正在加载目录…</div></nav>
      <div class="sidebar-foot">
        <span id="nav-count"></span>
        <a id="repo-link-2" href="#" target="_blank" rel="noopener" hidden>GitHub ↗</a>
      </div>
    </aside>
    <div id="overlay" class="overlay" hidden></div>

    <main id="main" class="main" tabindex="-1">
      <nav id="breadcrumb" class="breadcrumb" aria-label="当前位置"></nav>
      <article id="article" class="article markdown-body">
        <div class="skeleton"><span></span><span></span><span></span><span></span></div>
      </article>
      <nav id="pager" class="pager" aria-label="上一篇 / 下一篇"></nav>
      <footer class="page-foot">
        <div class="foot-left">
          <span id="foot-updated" class="foot-updated" hidden></span>
          <span id="foot-text" class="foot-text"></span>
        </div>
        <a id="edit-link" href="#" target="_blank" rel="noopener" hidden>在 GitHub 编辑此页 ↗</a>
      </footer>
    </main>

    <aside class="toc-wrap" aria-label="本页目录">
      <div class="toc-head">本页目录</div>
      <nav id="toc" class="toc"></nav>
    </aside>

    <button id="top-btn" class="top-btn" type="button" title="回到顶部" aria-label="回到顶部" hidden>↑</button>
  </div>
</div>

<!-- 窗口关闭 / 最小化后的桌面提示 -->
<div class="desktop-hint" id="desktop-hint">
  <div class="desktop-hint-card">
    <span class="dh-icon page-badge" data-brand-icon data-icon="📚" aria-hidden="true"></span>
    <h2 id="dh-title">学习笔记</h2>
    <p>窗口已收起。点击程序坞中的「笔记」或下面的按钮即可重新打开。</p>
    <button class="btn primary" id="reopen-btn" type="button">重新打开窗口</button>
  </div>
</div>

<!-- ===================== 程序坞 ===================== -->
<nav class="dock" aria-label="程序坞">
  <button class="dock-item dock-notes" id="dock-home" type="button" data-label="笔记" aria-label="打开笔记窗口">📚<span class="dock-dot" aria-hidden="true"></span></button>
  <button class="dock-item dock-search" id="dock-search" type="button" data-label="搜索" aria-label="搜索笔记">🔍</button>
  <button class="dock-item dock-theme" id="dock-theme" type="button" data-label="外观" aria-label="切换深色 / 浅色主题">🎨</button>
  <a class="dock-item dock-repo" id="dock-repo" href="#" target="_blank" rel="noopener" data-label="GitHub" aria-label="GitHub 仓库" hidden>🐙</a>
  <span class="dock-sep" aria-hidden="true"></span>
  <button class="dock-item dock-top" id="dock-top" type="button" data-label="回到顶部" aria-label="回到顶部">⬆️</button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
